<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karacikov — вход</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0f; --panel:#14141b; --line:#26262f; --text:#f2f2f5; --muted:#8a8a99;
    --accent:#e8ff5a; --danger:#ff6b6b; --ok:#5affb0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;overflow-x:hidden}
  .hidden{display:none!important}

  /* ---------- AUTH ---------- */
  #auth{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative}
  #auth::before{content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(600px 400px at 15% 10%,rgba(232,255,90,.08),transparent 60%),
               radial-gradient(500px 500px at 90% 90%,rgba(120,120,255,.07),transparent 60%)}
  .card{position:relative;width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);
    border-radius:20px;padding:32px 28px 28px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
  .brand{font-family:Unbounded,sans-serif;font-weight:900;font-size:22px;letter-spacing:.02em;margin-bottom:6px}
  .brand span{color:var(--accent)}
  .sub{color:var(--muted);font-size:14px;margin-bottom:24px}
  .tabs{display:grid;grid-template-columns:1fr 1fr;background:#0e0e13;border:1px solid var(--line);
    border-radius:12px;padding:4px;margin-bottom:22px}
  .tab{border:0;background:transparent;color:var(--muted);font:600 14px Manrope,sans-serif;padding:10px;
    border-radius:9px;cursor:pointer;transition:.2s}
  .tab.active{background:var(--text);color:#0b0b0f}
  label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:500}
  .field{position:relative}
  input[type=text],input[type=password]{width:100%;background:#0e0e13;border:1px solid var(--line);color:var(--text);
    font:500 15px Manrope,sans-serif;padding:13px 14px;border-radius:11px;outline:none;transition:border-color .2s}
  input:focus{border-color:var(--accent)}
  .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);
    cursor:pointer;font-size:12px;padding:6px 8px;font-family:Manrope,sans-serif}
  .eye:hover{color:var(--text)}
  .row{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--muted)}
  .row input{accent-color:var(--accent);width:16px;height:16px}
  .btn{width:100%;margin-top:22px;border:0;background:var(--accent);color:#0b0b0f;font:700 15px Manrope,sans-serif;
    padding:14px;border-radius:12px;cursor:pointer;transition:transform .1s,filter .2s}
  .btn:hover{filter:brightness(1.05)}
  .btn:active{transform:scale(.99)}
  .btn:disabled{opacity:.6;cursor:default}
  .msg{min-height:20px;margin-top:14px;font-size:13px;text-align:center}
  .msg.err{color:var(--danger)} .msg.ok{color:var(--ok)}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .switch{text-align:center;font-size:13px;color:var(--muted);margin-top:8px}
  .switch a{color:var(--text);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

  /* ---------- HOME ---------- */
  #home{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg)}
  #home h1{font-family:Unbounded,sans-serif;font-weight:900;text-transform:uppercase;line-height:.9;
    font-size:15.5vw;letter-spacing:-.03em;white-space:nowrap;user-select:none;
    background:linear-gradient(180deg,#ffffff 0%,#9a9aa8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(30px) scale(.98)}to{opacity:1;transform:none}}
  .topbar{position:fixed;top:16px;right:16px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
  .topbar b{color:var(--text);font-weight:600}
  .logout{border:1px solid var(--line);background:var(--panel);color:var(--text);font:600 13px Manrope,sans-serif;
    padding:8px 14px;border-radius:10px;cursor:pointer}
  .logout:hover{border-color:var(--muted)}
</style>
</head>
<body>

<!-- ===== Страница авторизации ===== -->
<section id="auth">
  <div class="card">
    <div class="brand">KARACIKOV<span>.</span></div>
    <p class="sub" id="subtitle">Войдите в свой аккаунт</p>

    <div class="tabs" role="tablist">
      <button class="tab active" data-mode="login" type="button">Вход</button>
      <button class="tab" data-mode="register" type="button">Регистрация</button>
    </div>

    <form id="form" autocomplete="on" novalidate>
      <label for="login">Логин</label>
      <input type="text" id="login" autocomplete="username" placeholder="Например, ivan_k" maxlength="32">
      <div class="hint reg-only hidden">3–32 символа: латиница, цифры, «_», «.», «-»</div>

      <label for="pass">Пароль</label>
      <div class="field">
        <input type="password" id="pass" autocomplete="current-password" placeholder="Введите пароль">
        <button type="button" class="eye" data-for="pass">показать</button>
      </div>

      <div class="reg-only hidden">
        <label for="pass2">Повторите пароль</label>
        <div class="field">
          <input type="password" id="pass2" autocomplete="new-password" placeholder="Ещё раз пароль">
          <button type="button" class="eye" data-for="pass2">показать</button>
        </div>
        <div class="hint">Минимум 6 символов</div>
      </div>

      <button class="btn" id="submit" type="submit">Войти</button>
      <div class="msg" id="msg"></div>
      <div class="switch" id="switch">Нет аккаунта? <a data-go="register">Зарегистрироваться</a></div>
    </form>
  </div>
</section>

<!-- ===== Главная (после входа) ===== -->
<section id="home" class="hidden">
  <div class="topbar">
    <span>Вы вошли как <b id="who"></b></span>
    <button class="logout" id="logout" type="button">Выйти</button>
  </div>
  <h1>karacikov</h1>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================== НАСТРОЙКИ SUPABASE ==================
   Вставьте сюда данные своего проекта:
   Supabase → Project Settings → API (или Data API)            */
const SUPABASE_URL = "https://cpdkkzkizftmuceydyqp.supabase.co";
const SUPABASE_KEY = "sb_publishable_De1nR8_tXRlkV-7BQB17IA_JZ30nQAt";
/* Логин превращается в служебный e-mail вида логин@домен.
   Письма никуда не отправляются (подтверждение e-mail нужно выключить). */
const LOGIN_DOMAIN = "karacikov.app";
/* ======================================================== */

const configured = true;
const sb = configured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
const toEmail = login => login.toLowerCase() + "@" + LOGIN_DOMAIN;

/* ---------- Интерфейс ---------- */
const $ = s => document.querySelector(s);
let mode = "login";

function setMode(m){
  mode = m;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.mode === m));
  document.querySelectorAll(".reg-only").forEach(e => e.classList.toggle("hidden", m !== "register"));
  document.querySelectorAll(".login-only").forEach(e => e.classList.toggle("hidden", m !== "login"));
  $("#submit").textContent = m === "login" ? "Войти" : "Создать аккаунт";
  $("#subtitle").textContent = m === "login" ? "Войдите в свой аккаунт" : "Создайте новый аккаунт";
  $("#pass").autocomplete = m === "login" ? "current-password" : "new-password";
  $("#switch").innerHTML = m === "login"
    ? 'Нет аккаунта? <a data-go="register">Зарегистрироваться</a>'
    : 'Уже есть аккаунт? <a data-go="login">Войти</a>';
  showMsg("");
}
function showMsg(t, type="err"){ const m = $("#msg"); m.textContent = t; m.className = "msg " + type; }

document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => setMode(t.dataset.mode)));
$("#switch").addEventListener("click", e => { if (e.target.dataset.go) setMode(e.target.dataset.go) });
document.querySelectorAll(".eye").forEach(b => b.addEventListener("click", () => {
  const i = document.getElementById(b.dataset.for);
  const show = i.type === "password";
  i.type = show ? "text" : "password";
  b.textContent = show ? "скрыть" : "показать";
}));

function ruError(err){
  const m = (err && err.message || "").toLowerCase();
  if (m.includes("invalid login credentials")) return "Неверный логин или пароль";
  if (m.includes("already registered") || m.includes("already been registered")) return "Такой логин уже занят";
  if (m.includes("email not confirmed")) return "В Supabase не выключено подтверждение e-mail";
  if (m.includes("password")) return "Пароль слишком простой или короткий";
  if (m.includes("rate limit")) return "Слишком много попыток, подождите немного";
  if (m.includes("fetch")) return "Нет связи с сервером";
  return "Ошибка: " + (err && err.message || "неизвестная");
}

$("#form").addEventListener("submit", async e => {
  e.preventDefault();
  if (!sb) return showMsg("Сайт ещё не подключён к базе: впишите SUPABASE_URL и SUPABASE_KEY");
  const login = $("#login").value.trim();
  const pass = $("#pass").value;
  if (!login || !pass) return showMsg("Заполните логин и пароль");
  if (!/^[a-zA-Z0-9_.\-]{3,32}$/.test(login)) return showMsg("Логин: 3–32 символа, латиница, цифры, _ . -");

  const btn = $("#submit"); btn.disabled = true; showMsg("Подождите…", "ok");
  try{
    if (mode === "register"){
      if (pass.length < 6) return showMsg("Пароль должен быть не короче 6 символов");
      if (pass !== $("#pass2").value) return showMsg("Пароли не совпадают");
      const { data, error } = await sb.auth.signUp({
        email: toEmail(login), password: pass,
        options: { data: { username: login } }
      });
      if (error) return showMsg(ruError(error));
      if (!data.session) return showMsg("Аккаунт создан, но в Supabase включено подтверждение e-mail — выключите его");
    } else {
      const { error } = await sb.auth.signInWithPassword({ email: toEmail(login), password: pass });
      if (error) return showMsg(ruError(error));
    }
    $("#form").reset(); showMsg("");
  } catch(err){
    showMsg(ruError(err));
  } finally { btn.disabled = false; }
});

function showHome(user){
  $("#who").textContent = (user.user_metadata && user.user_metadata.username) || user.email.split("@")[0];
  $("#auth").classList.add("hidden");
  $("#home").classList.remove("hidden");
  document.title = "Karacikov";
}
function showAuth(){
  $("#home").classList.add("hidden");
  $("#auth").classList.remove("hidden");
  document.title = "Karacikov — вход";
  setMode(mode);
}
$("#logout").addEventListener("click", async () => { if (sb) await sb.auth.signOut(); });

/* ---------- Старт: Supabase сам помнит вход ---------- */
if (sb){
  sb.auth.onAuthStateChange((_event, session) => session ? showHome(session.user) : showAuth());
} else {
  showAuth();
  showMsg("Сайт ещё не подключён к базе: впишите SUPABASE_URL и SUPABASE_KEY");
}
</script>
</body>
</html>
